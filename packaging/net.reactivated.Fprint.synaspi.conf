<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!--
  Our own copy of the policy for net.reactivated.Fprint.

  The identical file ships with the fprintd package, which we mask but keep
  installed. If fprintd is ever REMOVED (not just upgraded) that file goes with
  it, root loses permission to own the name, and fingerprint login dies with an
  error that points nowhere near the real cause. This file makes us independent
  of that package.
-->
<busconfig>
  <policy user="root">
    <allow own="net.reactivated.Fprint"/>
  </policy>

  <policy context="default">
    <allow send_destination="net.reactivated.Fprint"
           send_interface="net.reactivated.Fprint.Manager"/>
    <allow send_destination="net.reactivated.Fprint"
           send_interface="net.reactivated.Fprint.Device"/>
    <allow send_destination="net.reactivated.Fprint"
           send_interface="org.freedesktop.DBus.Properties"/>
    <allow send_destination="net.reactivated.Fprint"
           send_interface="org.freedesktop.DBus.Introspectable"/>
  </policy>
</busconfig>
